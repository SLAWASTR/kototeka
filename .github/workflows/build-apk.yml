name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      working-directory: ./android_kototeka
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for convenience
      run: |
        cp android_kototeka/app/build/outputs/apk/debug/app-debug.apk kototeka.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kototeka-android-apk
        path: kototeka.apk

    - name: Publish Release with APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v2.0.0
        name: "Кототека v2.0.0 (Android APK)"
        body: |
          🐾 **Кототека 2.0 — Премиальное обновление для коллекционирования городских котов!**

          ### ✨ Что нового в версии 2.0:
          - 🎨 **Премиальный Apple-like дизайн**: молочная тёплая светлая тема и глубокая тёмная тема в графитовых тонах.
          - 🐱 **Новый логотип**: лаконичный знак кошачьих ушек и видоискателя камеры.
          - 📸 **Retina-качество фотографий**: полноразмерные снимки до 2560px и кристально чёткие квадратные превью 640px.
          - 🔍 **Полноэкранный просмотр фото**: просмотр оригинальных снимков во весь экран в один тап.
          - 🎛️ **Нативная панель фильтров и сортировки**: удобный bottom sheet (фильтрация по окрасу, настроению, типу геолокации и сортировка).
          - 🔲 **Переключатель раскладки коллекции**: удобная сетка в 2 колонки или крупные карточки в 1 колонку.
          - ✏️ **Редактирование карточек**: возможность изменить кличку, дату, место встречи или заметки.
          - 🖼️ **Открытка котика 2.0 и экспорт в Telegram**: делитесь открытками и карточками встреченных пушистиков.
          - 🔄 **Бесшовное обновление**: устанавливается поверх v1.0.0 с полным сохранением всей вашей базы котиков и достижений!
          
          *Создано slawastr с любовью к уличным котикам.*
        files: kototeka.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
