name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build Debug APK
      working-directory: ./android_kototeka
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for convenience
      run: |
        cp android_kototeka/app/build/outputs/apk/debug/app-debug.apk kototeka.apk

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kototeka-android-apk
        path: kototeka.apk

    - name: Publish Release with APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: "Кототека v1.0.0 (Android APK)"
        body: |
          🐾 Готовый установочный файл приложения «Кототека» для Android.
          Скачайте `kototeka.apk` на смартфон и установите в один клик!
        files: kototeka.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
