<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#111113"/>
  <!-- Minimalist Geometric Cat Silhouette with Camera Aperture Lens -->
  <g fill="#FFFFFF">
    <!-- Left Ear -->
    <path d="M 130 180 L 160 80 C 164 68 180 72 186 86 L 220 180 Z"/>
    <!-- Right Ear -->
    <path d="M 382 180 L 352 80 C 348 68 332 72 326 86 L 292 180 Z"/>
    <!-- Cat Head & Body Contour -->
    <rect x="116" y="160" width="280" height="230" rx="90" fill="#FFFFFF"/>
    <!-- Camera Viewfinder Top Bar -->
    <rect x="220" y="130" width="72" height="30" rx="8" fill="#FFFFFF"/>
  </g>
  <!-- Inner Details cut out in Carbon Black -->
  <g fill="#111113">
    <!-- Left Inner Ear -->
    <path d="M 148 170 L 168 108 L 195 170 Z"/>
    <!-- Right Inner Ear -->
    <path d="M 364 170 L 344 108 L 317 170 Z"/>
    <!-- Central Camera Lens / Cat Iris -->
    <circle cx="256" cy="275" r="54" fill="#111113"/>
    <circle cx="256" cy="275" r="42" fill="#FFFFFF"/>
    <circle cx="256" cy="275" r="26" fill="#111113"/>
    <circle cx="264" cy="267" r="7" fill="#FFFFFF"/>
    <!-- Cat Whiskers Minimalist Dash -->
    <rect x="136" y="268" width="34" height="4" rx="2" fill="#111113"/>
    <rect x="142" y="282" width="28" height="4" rx="2" fill="#111113"/>
    <rect x="342" y="268" width="34" height="4" rx="2" fill="#111113"/>
    <rect x="342" y="282" width="28" height="4" rx="2" fill="#111113"/>
    <!-- Cute Cat Nose & Smile -->
    <path d="M 248 338 L 264 338 L 256 346 Z"/>
    <path d="M 242 352 C 248 358 254 358 256 352 C 258 358 264 358 270 352" stroke="#111113" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
