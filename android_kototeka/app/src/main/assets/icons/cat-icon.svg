<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF824C"/>
      <stop offset="100%" stop-color="#FF5D22"/>
    </linearGradient>

    <!-- Inner lens glass gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F7F5F0" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#B83A0E" flood-opacity="0.30"/>
    </feDropShadow>
  </defs>

  <!-- iOS squircle canvas background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Logo Mark: Geometric Cat Camera Viewfinder -->
  <g filter="url(#softShadow)">
    <!-- Cat Ears + Camera Body Silhouette (Pure White) -->
    <path d="
      M 160 148 
      L 196 208 
      L 316 208 
      L 352 148 
      C 358 138 372 142 370 154 
      L 362 216 
      C 396 220 416 244 416 280 
      L 416 368 
      C 416 404 388 428 352 428 
      L 160 428 
      C 124 428 96 404 96 368 
      L 96 280 
      C 96 244 116 220 150 216 
      L 142 154 
      C 140 142 154 138 160 148 
      Z
    " fill="#FFFFFF"/>

    <!-- Inner Cat Ear Cutouts (Terracotta accent) -->
    <path d="M 166 172 L 186 208 L 154 208 Z" fill="#FF7138" opacity="0.95"/>
    <path d="M 346 172 L 358 208 L 326 208 Z" fill="#FF7138" opacity="0.95"/>

    <!-- Central Camera Lens / Cat Pupil Ring -->
    <circle cx="256" cy="324" r="66" fill="#FF7138"/>
    <circle cx="256" cy="324" r="54" fill="#FFFFFF"/>
    <circle cx="256" cy="324" r="34" fill="#FF7138"/>

    <!-- Reflection glint in lens -->
    <circle cx="268" cy="312" r="10" fill="#FFFFFF" opacity="0.9"/>

    <!-- Flash / Finder dot top right -->
    <circle cx="372" cy="254" r="12" fill="#FF7138" opacity="0.85"/>
  </g>
</svg>
